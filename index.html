<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMB Services — Em construção</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    color: #f1f5f9;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  .card {
    max-width: 560px;
  }
  .badge {
    display: inline-block;
    background: rgba(56, 189, 248, 0.15);
    color: #38bdf8;
    border: 1px solid rgba(56, 189, 248, 0.4);
    border-radius: 999px;
    padding: 6px 16px;
    font-size: 13px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-bottom: 24px;
  }
  h1 {
    font-size: 2.2rem;
    margin-bottom: 16px;
    line-height: 1.2;
  }
  p {
    font-size: 1.05rem;
    color: #cbd5e1;
    line-height: 1.6;
  }
  .footer {
    margin-top: 40px;
    font-size: 0.85rem;
    color: #64748b;
  }
</style>
</head>
<body>
  <div class="card">
    <span class="badge">Em construção</span>
    <h1>Estamos a preparar algo novo.</h1>
    <p>O site da SMB Services está a ser atualizado. Voltaremos em breve com uma nova versão.</p>
    <div class="footer">&copy; <span id="year"></span> SMB Services</div>
  </div>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
